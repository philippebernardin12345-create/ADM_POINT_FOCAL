<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e11">
  <title>Connexion administrateur — Point Focal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #0b0e11; color: #fff; font: 16px Arial, sans-serif; }
    main { width: 100%; max-width: 420px; padding: 30px; border-radius: 14px; background: #1e2329; box-shadow: 0 16px 45px #0007; }
    h1 { margin: 0 0 24px; text-align: center; color: #f0b90b; font-size: 22px; }
    label { display: block; margin: 0 0 7px; color: #c6ccd3; font-size: 14px; }
    .field { margin-bottom: 16px; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #333b44; border-radius: 8px; outline: none; background: #111418; color: #fff; font-size: 15px; }
    input:focus { border-color: #f0b90b; }
    button { width: 100%; padding: 13px; border: 0; border-radius: 8px; background: #f0b90b; color: #000; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #loginMessage { min-height: 22px; margin-top: 15px; text-align: center; line-height: 1.4; }
    .footer { margin: 18px 0 0; text-align: center; color: #9aa4af; font-size: 13px; }
  </style>
  <script src="login-20261009-v3.js" defer></script>
</head>
<body>
  <main>
    <h1>Connexion administrateur</h1>
    <div class="field">
      <label for="adminEmail">Email administrateur</label>
      <input id="adminEmail" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="adminPassword">Mot de passe</label>
      <input id="adminPassword" type="password" autocomplete="current-password" required>
    </div>
    <button id="loginButton" type="button">Se connecter</button>
    <div id="loginMessage" role="status" aria-live="polite"></div>
    <p class="footer">Point Focal Admin</p>
  </main>
</body>
</html>
