<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunités - Point Focal Admin</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding-bottom: 90px;
            background: #0b0e11;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        body.modal-open { overflow: hidden; }
        .header {
            padding: 20px;
            text-align: center;
            background: #1e2329;
            border-bottom: 1px solid #2b3139;
        }
        .header h1 { margin: 0; color: #f0b90b; font-size: 25px; }
        .header p { margin: 10px 0 0; color: #b7bdc6; font-size: 14px; }
        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
        }
        .top-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
        }
        .add-button {
            width: 100%;
            max-width: 280px;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            background: #f0b90b;
            color: #000000;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .add-button:hover { background: #ffd43b; }
        .status-message {
            min-height: 24px;
            margin-bottom: 15px;
            text-align: center;
            color: #b7bdc6;
            line-height: 1.5;
        }
        .empty-state {
            display: none;
            padding: 35px 20px;
            border: 1px dashed #3a424c;
            border-radius: 12px;
            background: #1e2329;
            text-align: center;
            color: #b7bdc6;
        }
        .opportunities-list {
            display: grid;
            gap: 15px;
        }
        .card {
            padding: 18px;
            border: 1px solid #2b3139;
            border-radius: 12px;
            background: #1e2329;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .title {
            color: #f0b90b;
            font-size: 19px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }
        .badge {
            display: inline-block;
            flex-shrink: 0;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-active {
            background: rgba(76, 255, 138, 0.13);
            color: #4cff8a;
        }
        .badge-inactive {
            background: rgba(255, 107, 107, 0.13);
            color: #ff6b6b;
        }
        .badge-draft {
            background: rgba(240, 185, 11, 0.13);
            color: #f0b90b;
        }
        .description {
            margin-bottom: 14px;
            color: #d1d5db;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }
        .information-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
        }
        .info {
            padding: 10px;
            border-radius: 8px;
            background: #111418;
            color: #b7bdc6;
            font-size: 13px;
        }
        .info strong { color: #ffffff; }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .action-button {
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .edit-button {
            background: #f0b90b;
            color: #000000;
        }
        .toggle-button {
            background: #d83a3a;
            color: #ffffff;
        }
        .action-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.78);
        }
        .modal-overlay.visible { display: flex; }
        .modal {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 22px;
            border: 1px solid #333b44;
            border-radius: 14px;
            background: #1e2329;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.6);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .modal-header h2 { margin: 0; color: #f0b90b; font-size: 21px; }
        .close-button {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border: none;
            border-radius: 8px;
            background: #111418;
            color: #ffffff;
            font-size: 23px;
            cursor: pointer;
        }
        .field { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 7px;
            color: #d9dde3;
            font-size: 14px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #333b44;
            border-radius: 9px;
            outline: none;
            background: #111418;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }
        input:focus, textarea:focus, select:focus { border-color: #f0b90b; }
        textarea { min-height: 110px; resize: vertical; }
        .checkbox-group {
            display: grid;
            gap: 11px;
            margin-bottom: 20px;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            border: 1px solid #333b44;
            border-radius: 9px;
            background: #111418;
        }
        .checkbox-row input {
            width: 19px;
            height: 19px;
            margin: 0;
            accent-color: #f0b90b;
        }
        .checkbox-row label { margin: 0; cursor: pointer; }
        .submit-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #f0b90b;
            color: #000000;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .submit-button:disabled { opacity: 0.6; cursor: not-allowed; }
        .form-message {
            min-height: 24px;
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }
        .menu {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 50;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: #1e2329;
            border-top: 1px solid #2b3139;
        }
        .menu a {
            padding: 14px 4px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 12px;
        }
        .menu a:hover, .menu a.active {
            background: #2b3139;
            color: #f0b90b;
        }
        @media (max-width: 520px) {
            .top-actions { display: block; }
            .add-button { max-width: none; }
            .actions { grid-template-columns: 1fr; }
            .card-header { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Opportunités</h1>
        <p>Gestion des opportunités Point Focal</p>
    </header>

    <main class="container">

        <div class="top-actions">
            <button id="openAddModalButton" class="add-button" type="button">
                + Ajouter une opportunité
            </button>
        </div>

        <div id="pageMessage" class="status-message"></div>
        <div id="emptyState" class="empty-state">Aucune opportunité n'est encore affichée.</div>
        <section id="opportunitiesList" class="opportunities-list"></section>

    </main>

    <!-- MODAL -->
    <div id="opportunityModal" class="modal-overlay" aria-hidden="true">
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h2 id="modalTitle">Ajouter une opportunité</h2>
                <button id="closeModalButton" class="close-button" type="button" aria-label="Fermer">×</button>
            </div>
            <form id="opportunityForm">
                <div class="field">
                    <label for="opportunityName">Nom de l'opportunité</label>
                    <input id="opportunityName" type="text" placeholder="Exemple : Victory World" maxlength="150" required>
                </div>
                <div class="field">
                    <label for="opportunityDescription">Description</label>
                    <textarea id="opportunityDescription" placeholder="Décris cette opportunité..." maxlength="1500"></textarea>
                </div>
                <div class="field">
                    <label>Lien de l'opportunité</label>
                    <input id="opportunityUrl" type="url" placeholder="https://www.exemple.com">
                </div>
                <div class="field">
                    <label for="opportunityStatus">Statut</label>
                    <select id="opportunityStatus">
                        <option value="draft">Brouillon</option>
                        <option value="inactive">Inactive</option>
                        <option value="active">Active</option>
                    </select>
                </div>
                <div class="field">
                    <label for="defaultLanguage">Langue par défaut</label>
                    <select id="defaultLanguage">
                        <option value="fr">Français</option>
                        <option value="en">Anglais</option>
                        <option value="es">Espagnol</option>
                        <option value="pt">Portugais</option>
                        <option value="ar">Arabe</option>
                        <option value="hi">Hindi</option>
                    </select>
                </div>
                <div class="checkbox-group">
                    <div class="checkbox-row">
                        <input id="prelaunchEnabled" type="checkbox">
                        <label for="prelaunchEnabled">Activer le pré-lancement</label>
                    </div>
                    <div class="checkbox-row">
                        <input id="publicOpen" type="checkbox">
                        <label for="publicOpen">Ouvrir au public</label>
                    </div>
                </div>
                <button id="submitButton" class="submit-button" type="submit">Ajouter l'opportunité</button>
                <div id="formMessage" class="form-message"></div>
            </form>
        </section>
    </div>

    <nav class="menu">
        <a href="dashboard-admin.html">📊<br>Tableau</a>
        <a href="users-admin.html">👥<br>Utilisateurs</a>
        <a href="opportunities-admin.html" class="active">🎯<br>Opportunités</a>
        <a href="settings-admin.html">⚙️<br>Paramètres</a>
    </nav>

    <script src="admin.js"></script>

    <script>
        // ============================================================
        // ÉLÉMENTS
        // ============================================================
        const openAddModalButton = document.getElementById("openAddModalButton");
        const closeModalButton = document.getElementById("closeModalButton");
        const opportunityModal = document.getElementById("opportunityModal");
        const opportunityForm = document.getElementById("opportunityForm");
        const modalTitle = document.getElementById("modalTitle");
        const opportunityName = document.getElementById("opportunityName");
        const opportunityDescription = document.getElementById("opportunityDescription");
        const opportunityUrl = document.getElementById("opportunityUrl");
        const opportunityStatus = document.getElementById("opportunityStatus");
        const defaultLanguage = document.getElementById("defaultLanguage");
        const prelaunchEnabled = document.getElementById("prelaunchEnabled");
        const publicOpen = document.getElementById("publicOpen");
        const submitButton = document.getElementById("submitButton");
        const formMessage = document.getElementById("formMessage");
        const pageMessage = document.getElementById("pageMessage");
        const emptyState = document.getElementById("emptyState");
        const opportunitiesList = document.getElementById("opportunitiesList");

        let opportunities = [];
        let editingOpportunityId = null;

        // ============================================================
        // DONNÉES SIMULÉES
        // ============================================================
        const simulatedOpportunities = [
            {
                id: 'opp-1',
                name: 'Victory World',
                description: 'Opportunité internationale de croissance pour les leaders',
                status: 'active',
                default_language: 'fr',
                prelaunch_enabled: true,
                public_open: false,
                url: 'https://victory-world.com'
            },
            {
                id: 'opp-2',
                name: 'Eco Green Project',
                description: 'Projet écologique pour les entreprises responsables',
                status: 'draft',
                default_language: 'en',
                prelaunch_enabled: false,
                public_open: true,
                url: 'https://eco-green.com'
            },
            {
                id: 'opp-3',
                name: 'Digital Academy',
                description: 'Formation numérique pour les leaders de demain',
                status: 'inactive',
                default_language: 'fr',
                prelaunch_enabled: true,
                public_open: false,
                url: 'https://digital-academy.com'
            }
        ];

        // ============================================================
        // FONCTIONS
        // ============================================================
        function escapeHtml(value) {
            return String(value || "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function renderOpportunities(opps) {
            if (!opps || opps.length === 0) {
                emptyState.style.display = 'block';
                opportunitiesList.innerHTML = '';
                return;
            }
            emptyState.style.display = 'none';
            opportunitiesList.innerHTML = opps.map(opp => `
                <div class="card" data-id="${opp.id}">
                    <div class="card-header">
                        <span class="title">${escapeHtml(opp.name)}</span>
                        <span class="badge badge-${opp.status}">${opp.status}</span>
                    </div>
                    <div class="description">${escapeHtml(opp.description || '')}</div>
                    <div class="information-grid">
                        <div class="info"><strong>Langue :</strong> ${opp.default_language || 'fr'}</div>
                        <div class="info"><strong>Pré-lancement :</strong> ${opp.prelaunch_enabled ? '✅' : '❌'}</div>
                        <div class="info"><strong>Public :</strong> ${opp.public_open ? '✅' : '❌'}</div>
                    </div>
                    <div class="actions">
                        <button class="action-button edit-button" onclick="editOpportunity('${opp.id}')">✏️ Modifier</button>
                        <button class="action-button toggle-button" onclick="toggleOpportunity('${opp.id}')">
                            ${opp.status === 'active' ? '⏸️ Désactiver' : '▶️ Activer'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ============================================================
        // CHARGEMENT AVEC SIMULATION
        // ============================================================
        async function loadOpportunities() {
            // Afficher immédiatement les données simulées
            opportunities = simulatedOpportunities;
            renderOpportunities(opportunities);
            pageMessage.textContent = `${opportunities.length} opportunité(s) (mode simulation)`;
            pageMessage.style.color = '#f0b90b';

            // Essayer l'API en arrière-plan
            try {
                const data = await adminApiCall('/admin/opportunities');
                if (Array.isArray(data) && data.length > 0) {
                    opportunities = data;
                    renderOpportunities(opportunities);
                    pageMessage.textContent = `${opportunities.length} opportunité(s) chargées depuis l'API`;
                    pageMessage.style.color = '#4cff8a';
                }
            } catch (error) {
                console.warn('⚠️ API lente ou hors ligne, données simulées conservées');
            }
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(opportunity = null) {
            editingOpportunityId = opportunity?.id || null;
            modalTitle.textContent = editingOpportunityId ? 'Modifier l\'opportunité' : 'Ajouter une opportunité';
            submitButton.textContent = editingOpportunityId ? 'Modifier' : 'Ajouter';

            if (opportunity) {
                opportunityName.value = opportunity.name || '';
                opportunityDescription.value = opportunity.description || '';
                opportunityUrl.value = opportunity.url || '';
                opportunityStatus.value = opportunity.status || 'draft';
                defaultLanguage.value = opportunity.default_language || 'fr';
                prelaunchEnabled.checked = opportunity.prelaunch_enabled || false;
                publicOpen.checked = opportunity.public_open || false;
            } else {
                opportunityForm.reset();
                opportunityStatus.value = 'draft';
                defaultLanguage.value = 'fr';
            }

            formMessage.textContent = '';
            opportunityModal.classList.add('visible');
            document.body.classList.add('modal-open');
        }

        function closeModal() {
            opportunityModal.classList.remove('visible');
            document.body.classList.remove('modal-open');
            editingOpportunityId = null;
        }

        // ============================================================
        // ÉDITION / TOGGLE
        // ============================================================
        async function editOpportunity(id) {
            const opp = opportunities.find(o => o.id === id);
            if (opp) openModal(opp);
        }

        async function toggleOpportunity(id) {
            const opp = opportunities.find(o => o.id === id);
            if (!opp) return;

            const newStatus = opp.status === 'active' ? 'inactive' : 'active';
            
            try {
                await adminApiCall(`/admin/opportunities/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ ...opp, status: newStatus })
                });
                
                // Mettre à jour localement
                opp.status = newStatus;
                renderOpportunities(opportunities);
                pageMessage.textContent = `✅ Statut mis à jour : ${newStatus}`;
                pageMessage.style.color = '#4cff8a';
            } catch (error) {
                // Mode simulation - mise à jour locale
                opp.status = newStatus;
                renderOpportunities(opportunities);
                pageMessage.textContent = `🔧 Simulation : statut mis à jour en ${newStatus}`;
                pageMessage.style.color = '#f0b90b';
            }
        }

        // ============================================================
        // SUBMIT FORMULAIRE
        // ============================================================
        async function submitOpportunityForm(event) {
            event.preventDefault();

            const formData = {
                name: opportunityName.value.trim(),
                description: opportunityDescription.value.trim(),
                url: opportunityUrl.value.trim(),
                status: opportunityStatus.value,
                default_language: defaultLanguage.value,
                prelaunch_enabled: prelaunchEnabled.checked,
                public_open: publicOpen.checked
            };

            if (!formData.name) {
                formMessage.textContent = 'Le nom est requis';
                formMessage.style.color = '#ff6b6b';
                return;
            }

            try {
                submitButton.disabled = true;
                submitButton.textContent = 'Envoi...';
                formMessage.textContent = '';

                if (editingOpportunityId) {
                    await adminApiCall(`/admin/opportunities/${editingOpportunityId}`, {
                        method: 'PUT',
                        body: JSON.stringify(formData)
                    });
                    // Mise à jour locale
                    const index = opportunities.findIndex(o => o.id === editingOpportunityId);
                    if (index !== -1) {
                        opportunities[index] = { ...opportunities[index], ...formData };
                    }
                } else {
                    await adminApiCall('/admin/opportunities', {
                        method: 'POST',
                        body: JSON.stringify(formData)
                    });
                    // Ajout local
                    const newOpp = { id: 'local-' + Date.now(), ...formData };
                    opportunities.push(newOpp);
                }

                formMessage.textContent = editingOpportunityId ? '✅ Modifié avec succès' : '✅ Créé avec succès';
                formMessage.style.color = '#4cff8a';

                closeModal();
                loadOpportunities();

            } catch (error) {
                // Mode simulation - mise à jour locale même si API échoue
                if (editingOpportunityId) {
                    const index = opportunities.findIndex(o => o.id === editingOpportunityId);
                    if (index !== -1) {
                        opportunities[index] = { ...opportunities[index], ...formData };
                    }
                } else {
                    const newOpp = { id: 'local-' + Date.now(), ...formData };
                    opportunities.push(newOpp);
                }
                renderOpportunities(opportunities);
                closeModal();
                pageMessage.textContent = '🔧 Simulation : action effectuée localement';
                pageMessage.style.color = '#f0b90b';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = editingOpportunityId ? 'Modifier' : 'Ajouter';
            }
        }

        // ============================================================
        // ÉVÉNEMENTS
        // ============================================================
        openAddModalButton.addEventListener('click', () => openModal());
        closeModalButton.addEventListener('click', closeModal);
        opportunityModal.addEventListener('click', (e) => {
            if (e.target === opportunityModal) closeModal();
        });
        opportunityForm.addEventListener('submit', submitOpportunityForm);

        protectAdminPage();
        loadOpportunities();
    </script>

</body>
</html>
