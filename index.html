<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administration Point Focal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0b0e11;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            border-radius: 14px;
            background: #1e2329;
            text-align: center;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 12px;
            color: #f0b90b;
            font-size: 27px;
        }

        p {
            margin: 0 0 24px;
            color: #b7bdc6;
            line-height: 1.5;
        }

        .badge {
            display: inline-block;
            margin-bottom: 22px;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(240, 185, 11, 0.12);
            border: 1px solid rgba(240, 185, 11, 0.35);
            color: #f0b90b;
            font-size: 13px;
            font-weight: bold;
        }

        .button {
            display: block;
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            background: #f0b90b;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #707a8a;
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="logo.jpg"
        alt="Point Focal"
        class="logo"
    >

    <div class="badge">
        ESPACE SÉCURISÉ
    </div>

    <h1>
        Administration Point Focal
    </h1>

    <p>
        Gestion des utilisateurs, des opportunités,
        de la rotation FIFO, du marketing et de
        l’intelligence artificielle.
    </p>

    <a
        href="login-admin.html"
        class="button"
    >
        Accéder à l’administration
    </a>

    <div class="footer">
        Point Focal Admin V1
    </div>

</div>

</body>
</html>
