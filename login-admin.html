<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion administrateur</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0b0e11;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #1e2329;
            padding: 30px;
            border-radius: 14px;
        }

        h2 {
            text-align: center;
            color: #f0b90b;
            margin-top: 0;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #111418;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #f0b90b;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            color: #9aa4af;
        }

        .login-message {
            margin-top: 15px;
            text-align: center;
            min-height: 20px;
        }

    </style>

</head>

<body>

    <div class="card">

        <h2>
            Connexion administrateur
        </h2>

        <input
            id="adminEmail"
            type="email"
            placeholder="Email administrateur"
            autocomplete="email"
        >

        <input
            id="adminPassword"
            type="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
        >

        <button id="loginButton">
            Se connecter
        </button>

        <div
            id="loginMessage"
            class="login-message"
        ></div>

        <div class="message">
            Tableau de bord Point Focal Admin V1
        </div>

    </div>

    <script src="admin.js"></script>

    <script>

        const button =
            document.getElementById(
                "loginButton"
            );

        const emailInput =
            document.getElementById(
                "adminEmail"
            );

        const passwordInput =
            document.getElementById(
                "adminPassword"
            );

        const message =
            document.getElementById(
                "loginMessage"
            );


        button.addEventListener(
            "click",
            loginAdmin
        );


        passwordInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {
                    loginAdmin();
                }

            }
        );


        async function loginAdmin() {

            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();

            const password =
                passwordInput.value;


            if (!email || !password) {

                showAdminMessage(
                    message,
                    "Entre ton email et ton mot de passe."
                );

                return;
            }


            try {

                button.disabled = true;

                button.textContent =
                    "Connexion...";

                message.textContent = "";


                const data =
                    await adminApiCall(
                        "/admin/login",
                        {
                            method: "POST",

                            body: JSON.stringify({
                                email,
                                password
                            })
                        }
                    );


                const token =
                    data.token
                    || data.accessToken
                    || data.access_token
                    || data.data?.token;


                const user =
                    data.user
                    || data.admin
                    || data.data?.user
                    || data.data?.admin;


                if (!token) {
                    throw new Error(
                        "Le backend n'a retourné aucun token."
                    );
                }


                saveAdminToken(token);

                if (user) {
                    saveAdminUser(user);
                }


                window.location.href =
                    "dashboard-admin.html";

            }

            catch (error) {

                showAdminMessage(
                    message,
                    error.message
                );

            }

            finally {

                button.disabled = false;

                button.textContent =
                    "Se connecter";

            }

        }

    </script>

</body>
</html>
