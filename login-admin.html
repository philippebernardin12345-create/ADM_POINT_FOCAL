<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion administrateur</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0b0e11;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #1e2329;
            padding: 30px;
            border-radius: 14px;
        }

        h2 {
            text-align: center;
            color: #f0b90b;
            margin-top: 0;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #111418;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #f0b90b;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            color: #9aa4af;
        }

    </style>

</head>

<body>

    <div class="card">

        <h2>
            Connexion administrateur
        </h2>

        <input
            type="email"
            placeholder="Email administrateur"
        >

        <input
            type="password"
            placeholder="Mot de passe"
        >

        <button>
            Se connecter
        </button>

        <div class="message">
            Tableau de bord Point Focal Admin V1
        </div>

    </div>

</body>
</html>
